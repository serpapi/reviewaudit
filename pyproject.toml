[project]
name = "reviewaudit"
version = "0.1.0"
description = "Is this 4.8 real? Reads a Google Maps place's reviews for the tells of manipulation, through SerpApi."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Cagdas Salur", email = "cagdassalur@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["serpapi", "google-maps", "reviews", "fake-reviews", "review-fraud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "serpapi>=1.1.1",
    "uvicorn[standard]>=0.53.0",
]

[project.urls]
Homepage = "https://github.com/zcag/reviewaudit"
Source = "https://github.com/zcag/reviewaudit"

[project.scripts]
reviewaudit = "reviewaudit:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

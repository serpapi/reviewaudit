<meta charset="utf-8">
{% include "favicon.html" %}
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ place.title }} · reviewaudit</title>
{% if og %}
<meta name="description" content="{{ og.description }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ og.title }}">
<meta property="og:description" content="{{ og.description }}">
{% if og.image %}<meta property="og:image" content="{{ og.image }}">{% endif %}
<meta name="twitter:card" content="{{ 'summary_large_image' if og.image else 'summary' }}">
{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
{% include "style.css" %}
</style>
